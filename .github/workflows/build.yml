name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["dist/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already has the Android SDK; just make sure the packages we compile against exist.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a fixed signing key so new builds install over old ones (keeps your rules).
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SK_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SK_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SK_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Screenkeeper.apk

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: Screenkeeper-apk
          path: Screenkeeper.apk

      # Keep the latest APK in the repo so there is a permanent download link without needing a release.
      - name: Publish APK to dist/
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          cp Screenkeeper.apk dist/Screenkeeper.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Screenkeeper.apk
          git diff --cached --quiet || git commit -m "Build: update dist/Screenkeeper.apk from ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:main

      - name: Attach APK to the release (tags and published releases)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Screenkeeper.apk
